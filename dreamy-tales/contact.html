<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - Dreamy Tales</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f5f5f5; color: #333; padding: 20px; line-height: 1.6; }
        h1 { color: #4B0082; }
        input, textarea { width: 100%; padding: 10px; margin-bottom: 10px; }
        button { padding: 10px 15px; background-color: #4B0082; color: white; border: none; cursor: pointer; }
        button:hover { background-color: #6a0dad; }
        .footer { margin-top: 20px; }
    </style>
</head>
<body>

    <h1>Contact Us</h1>
    <p>Send us a message and we will get back to you as soon as possible!</p>

    <input type="text" id="name" placeholder="Your Name">
    <input type="email" id="email" placeholder="Your Email">
    <textarea id="message" placeholder="Your Message" rows="5"></textarea>
    <button id="sendBtn">Send Message</button>

    <div id="status"></div>

    <div class="footer">
        <a href="index.html">Home</a>
    </div>

    <!-- Firebase -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.2/firebase-app.js";
        import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyC2AdR1P85jqzsZv2wrw8klfotXYDwn7j4",
            authDomain: "dreamy-tales-78de0.firebaseapp.com",
            projectId: "dreamy-tales-78de0",
            storageBucket: "dreamy-tales-78de0.appspot.com",
            messagingSenderId: "377795995336",
            appId: "1:377795995336:web:ff99da8aaf3fe76741a7fd"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const sendBtn = document.getElementById("sendBtn");
        const statusDiv = document.getElementById("status");

        sendBtn.addEventListener("click", async () => {
            const name = document.getElementById("name").value.trim();
            const email = document.getElementById("email").value.trim();
            const message = document.getElementById("message").value.trim();

            if(name && email && message) {
                try {
                    await addDoc(collection(db, "contacts"), { name, email, message, timestamp: new Date() });
                    statusDiv.textContent = "Message sent successfully!";
                    statusDiv.style.color = "green";
                    document.getElementById("name").value = "";
                    document.getElementById("email").value = "";
                    document.getElementById("message").value = "";
                } catch (error) {
                    statusDiv.textContent = "Error sending message!";
                    statusDiv.style.color = "red";
                    console.error(error);
                }
            } else {
                statusDiv.textContent = "Please fill all fields!";
                statusDiv.style.color = "red";
            }
        });
    </script>

</body>
</html>
