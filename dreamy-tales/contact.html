<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us - Dreamy Tales</title>
  <style>
    body { 
      font-family: Arial, sans-serif; 
      background-color: #f5f5f5; 
      color: #333; 
      padding: 20px; 
      line-height: 1.6; 
    }
    h1 { color: #4B0082; }
    input, textarea { width: 100%; padding: 10px; margin-bottom: 10px; border-radius: 5px; border: 1px solid #ccc; }
    button { 
      padding: 10px 15px; 
      background-color: #4B0082; 
      color: white; 
      border: none; 
      cursor: pointer; 
      border-radius: 5px;
    }
    button:hover { background-color: #6a0dad; }
    .footer { margin-top: 20px; }
    #status { margin-top: 10px; font-weight: bold; }
  </style>
</head>
<body>

  <h1>Contact Us</h1>
  <p>Send us a message and we will get back to you as soon as possible!</p>

  <form id="contactForm">
    <input type="text" id="name" name="name" placeholder="Your Name" required>
    <input type="email" id="email" name="email" placeholder="Your Email" required>
    <textarea id="message" name="message" placeholder="Your Message" rows="5" required></textarea>
    <button type="submit">Send Message</button>
  </form>

  <div id="status"></div>

  <div class="footer">
    <a href="index.html">Home</a>
  </div>

  <script>
    const form = document.getElementById('contactForm');
    const statusDiv = document.getElementById('status');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      const formData = {
        name: form.name.value.trim(),
        email: form.email.value.trim(),
        message: form.message.value.trim()
      };

      if (!formData.name || !formData.email || !formData.message) {
        statusDiv.textContent = "Please fill all fields!";
        statusDiv.style.color = "red";
        return;
      }

      try {
        const res = await fetch('/send-email', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(formData)
        });

        const text = await res.text();
        statusDiv.textContent = text;
        statusDiv.style.color = "green";

        form.reset();
      } catch (err) {
        console.error(err);
        statusDiv.textContent = "Error sending message!";
        statusDiv.style.color = "red";
      }
    });
  </script>

</body>
</html>
