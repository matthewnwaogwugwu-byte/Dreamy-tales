<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Contact - Dreamy Tales</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f9f5f2;
            color: #333;
            margin: 0;
            padding: 0;
        }
        header {
            background-color: #ffcccb;
            padding: 20px;
            text-align: center;
        }
        h1 {
            margin: 0;
        }
        main {
            max-width: 600px;
            margin: 40px auto;
            padding: 20px;
            background-color: #fff;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }
        input, textarea {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            border-radius: 5px;
            border: 1px solid #ccc;
            font-size: 16px;
        }
        button {
            margin-top: 20px;
            padding: 12px 20px;
            background-color: #ff6666;
            border: none;
            color: white;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
        }
        button:hover {
            background-color: #ff4d4d;
        }
        nav a {
            margin: 0 15px;
            color: #333;
            text-decoration: none;
            font-weight: bold;
        }
        nav {
            text-align: center;
            margin-bottom: 20px;
        }
    </style>

<body>

<header>
    <h1>Dreamy Tales</h1>
</header>

<nav>
    <a href="index.html">Home</a>
    <a href="contact.html">Contact</a>
    <a href="dreamy-tales/whispers_part1.html">Whispers of Desire</a>

</nav>

<main>
    <h2>Contact Me</h2>
    <p>If you want to reach me, please fill the form below or send an email directly.</p>
    
    <form action="mailto:chiemezuejeremiah@gmail.com" method="post" enctype="text/plain">
        <label for="name">Your Name:</label>
        <input type="text" id="name" name="name" required>

        <label for="email">Your Email:</label>
        <input type="email" id="email" name="email" required>

        <label for="message">Your Message:</label>
        <textarea id="message" name="message" rows="6" required></textarea>

        <button type="submit">Send Message</button>
    </form>

    <p>Or email directly: <a href="mailto:chiemezuejeremiah@gmail.com">chiemezuejeremiah@gmail.com</a></p>
</main>

</body>
