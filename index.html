<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dreamy Tales</title>
<style>
  /* Body and background */
  body {
    margin: 0;
    padding: 0;
    font-family: Arial, sans-serif;
    background: linear-gradient(to bottom, #1a2a6c, #b21f1f, #fdbb2d);
    height: 100vh;
    overflow: hidden;
    display: flex;
    justify-content: center;
    align-items: center;
    flex-direction: column;
  }

  /* Moving floating lights effect */
  .light {
    position: absolute;
    width: 20px;
    height: 20px;
    background: rgba(255, 255, 255, 0.5);
    border-radius: 50%;
    animation: float 6s infinite ease-in-out;
  }

  @keyframes float {
    0% { transform: translateY(0) translateX(0);}
    50% { transform: translateY(-50px) translateX(50px);}
    100% { transform: translateY(0) translateX(0);}
  }

  /* Container for story boxes */
  .container {
    display: flex;
    gap: 40px;
    z-index: 1;
  }

  /* Story boxes */
  .story-box {
    width: 200px;
    height: 200px;
    background: rgba(255, 255, 255, 0.1);
    border: 2px solid white;
    border-radius: 15px;
    display: flex;
    justify-content: center;
    align-items: center;
    color: white;
    font-size: 20px;
    font-weight: bold;
    text-align: center;
    cursor: pointer;
    transition: all 0.4s ease;
    box-shadow: 0 0 10px rgba(255,255,255,0.2);
  }

  .story-box:hover {
    background: rgba(255, 255, 255, 0.3);
    transform: scale(1.1);
    box-shadow: 0 0 30px rgba(255,255,255,0.8);
  }
</style>
</head>
<body>

<!-- Floating lights -->
<div class="light" style="top: 20%; left: 10%; animation-delay: 0s;"></div>
<div class="light" style="top: 50%; left: 30%; animation-delay: 2s;"></div>
<div class="light" style="top: 70%; left: 70%; animation-delay: 4s;"></div>
<div class="light" style="top: 30%; left: 80%; animation-delay: 6s;"></div>
<div class="light" style="top: 60%; left: 50%; animation-delay: 1s;"></div>

<!-- Story boxes container -->
<div class="container">
  <div class="story-box" onclick="goToParts('whispers')">Whispers of Desire</div>
  <div class="story-box" onclick="goToParts('shadows')">Shadows of the Heart</div>
</div>

<script>
  function goToParts(story) {
    // Redirect to Part Selection page
    window.location.href = story + '_parts.html';
  }
</script>

</body>
</html>
